<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp automation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem; }
    h1 { margin-top: 0; }
    .section { margin: 1.5rem 0; }
    input[type="file"] { margin-right: 0.5rem; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; margin: 0.25rem; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .preview table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    .preview th, .preview td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .preview th { background: #f0f0f0; }
    .university-block { margin: 1rem 0; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; }
    .university-block h3 { margin: 0 0 0.5rem 0; }
    .error { color: #c00; }
    .success { color: #060; }
    .status { margin-top: 0.5rem; }
    label { margin-right: 0.5rem; }
  </style>
</head>
<body>
  <h1>WhatsApp automation</h1>

  <div class="section">
    <label for="file">Excel (.xlsx):</label>
    <input type="file" id="file" accept=".xlsx">
    <button type="button" id="uploadBtn">Upload</button>
    <p id="uploadError" class="error"></p>
  </div>

  <div id="previewSection" class="section" style="display: none;">
    <p id="summary"></p>
    <label><input type="checkbox" id="dryRun"> Dry run (don't send)</label>
    <div style="margin-top: 0.5rem;">
      <button type="button" id="sendAllBtn">Send all</button>
    </div>
    <div id="preview" class="preview"></div>
    <p id="sendStatus" class="status"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
